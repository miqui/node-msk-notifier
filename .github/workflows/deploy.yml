name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: notif-system
  K8S_NAMESPACE: notifications

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      # Only build and push images on push to main
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -f Dockerfile.api \
            -t $REGISTRY/node-msk-notifier-api:$TAG \
            -t $REGISTRY/node-msk-notifier-api:latest \
            .
          docker push $REGISTRY/node-msk-notifier-api:$TAG
          docker push $REGISTRY/node-msk-notifier-api:latest

      - name: Build & push consumer image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -f Dockerfile.consumer \
            -t $REGISTRY/node-msk-notifier-consumer:$TAG \
            -t $REGISTRY/node-msk-notifier-consumer:latest \
            .
          docker push $REGISTRY/node-msk-notifier-consumer:$TAG
          docker push $REGISTRY/node-msk-notifier-consumer:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Apply K8s base manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Create / update K8s secrets
        env:
          MSK_BROKERS: ${{ secrets.MSK_BROKERS }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          kubectl create secret generic node-msk-notifier-secrets \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=MSK_BROKERS="$MSK_BROKERS" \
            --from-literal=SNS_TOPIC_ARN="$SNS_TOPIC_ARN" \
            --from-literal=API_KEY="$API_KEY" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply deployments, service, and ingress
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/api-ingress.yaml
          kubectl apply -f k8s/consumer-deployment.yaml

      - name: Roll out new images
        env:
          REGISTRY: ${{ needs.build.outputs.ecr-registry }}
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          kubectl set image deployment/node-msk-notifier-api \
            api=$REGISTRY/node-msk-notifier-api:$TAG \
            --namespace=${{ env.K8S_NAMESPACE }}

          kubectl set image deployment/node-msk-notifier-consumer \
            consumer=$REGISTRY/node-msk-notifier-consumer:$TAG \
            --namespace=${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/node-msk-notifier-api \
            --namespace=${{ env.K8S_NAMESPACE }} --timeout=300s

          kubectl rollout status deployment/node-msk-notifier-consumer \
            --namespace=${{ env.K8S_NAMESPACE }} --timeout=300s
